<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音楽 Lecteur</title>
<meta name="theme-color" content="#0a0e22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{
  --bg:#dfe5f3;--bg2:rgba(215,224,248,.75);--pn:rgba(247,249,255,.8);--ink:#1b2140;--mu:#555c7c;--ln:rgba(110,125,185,.35);
  --ac:#5a6fe0;--ai:#ffffff;--go:#6f80bd;
  --ov:linear-gradient(90deg,rgba(236,241,255,.8),rgba(236,241,255,.4) 55%,rgba(236,241,255,.08));
  --serif:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Zen Kaku Gothic New","Yu Gothic","Meiryo","Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e22;--bg2:rgba(48,62,125,.45);--pn:rgba(10,14,36,.72);--ink:#eef1ff;--mu:#a9b2d8;--ln:rgba(150,165,225,.28);
    --ac:#8ea6ff;--ai:#0b1030;--go:#c4cdea;
    --ov:linear-gradient(90deg,rgba(6,8,24,.7),rgba(6,8,24,.3) 55%,rgba(6,8,24,0));color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e22;--bg2:rgba(48,62,125,.45);--pn:rgba(10,14,36,.72);--ink:#eef1ff;--mu:#a9b2d8;--ln:rgba(150,165,225,.28);
  --ac:#8ea6ff;--ai:#0b1030;--go:#c4cdea;
  --ov:linear-gradient(90deg,rgba(6,8,24,.7),rgba(6,8,24,.3) 55%,rgba(6,8,24,0));color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:var(--bg)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--ov),url("wolf-bg.webp") 78% center/cover no-repeat}
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-8%;background:#fff;border-radius:50%;opacity:.8;animation:fall linear infinite;animation-play-state:paused}
.playing .snow i{animation-play-state:running}
@keyframes fall{from{top:-8%;transform:translateX(0)}50%{transform:translateX(30px)}to{top:108%;transform:translateX(-16px)}}
@media (prefers-reduced-motion:reduce){.snow i{animation:none}}

.shell{position:relative;z-index:1;width:min(500px,calc(100% - 32px));margin:0 0 0 clamp(16px,6vw,110px);padding:22px 0 40px;display:grid;gap:16px}
@media (max-width:700px){.shell{margin:0 auto}.head{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
.head{display:flex;align-items:center;gap:14px}
.hanko{width:46px;height:46px;display:grid;place-items:center;background:var(--ac);color:var(--ai);font-family:var(--serif);font-size:1.5rem;border-radius:4px;box-shadow:inset 0 0 0 4px var(--ac),inset 0 0 0 5px rgba(255,255,255,.55)}
.brand{font-family:var(--serif);font-size:1.25rem;letter-spacing:.14em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.brand2{color:var(--mu);font-size:.82rem}
.card{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:22px}
.list.over{border-color:var(--ac)}

.orb{position:relative;width:min(100%,280px);aspect-ratio:1210/1192;margin:0 auto 8px}
.disc{position:absolute;left:18.69%;top:21.25%;width:62.46%;height:62.11%;border-radius:50%;overflow:hidden;background:#0a0e22;transition:box-shadow .4s}
.cover{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center}
#media{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.orb.has-video #media{display:block}
.orb.has-video .cover{display:none}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.playing .disc{box-shadow:0 0 34px 6px rgba(150,170,255,.45)}

.meta{text-align:center;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:700;font-size:1.4rem;line-height:1.3;margin:0 0 4px;word-break:break-word}
.sub{color:var(--mu);font-size:.9rem;margin:0;min-height:1.2em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--ac) var(--p),var(--ln) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ac);border:2px solid var(--go);margin-top:-6px}
input[type=range]::-moz-range-track{height:3px;background:linear-gradient(to right,var(--ac) var(--p),var(--ln) var(--p))}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--go)}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:.78rem;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0}
button{font:inherit;cursor:pointer}
.k{width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--go);background:transparent;color:var(--ink);border-radius:3px;font-family:var(--serif);font-size:1.2rem}
.k:hover{background:var(--ln)}
.k[aria-pressed=true]{background:var(--go);color:var(--bg)}
.main{position:relative;width:68px;height:68px;border:none;border-radius:6px;background:var(--ac);color:var(--ai);font-size:1.25rem;display:grid;place-items:center}
.main::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.55);border-radius:3px;pointer-events:none}
button:focus-visible,input:focus-visible,.row:focus-visible,label.pick:focus-within{outline:3px solid var(--go);outline-offset:2px}
.vol{display:flex;align-items:center;gap:12px;color:var(--mu);font-family:var(--serif)}
.vol input{flex:1}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h2{font-family:var(--serif);font-size:1.15rem;margin:0;letter-spacing:.08em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.pick{background:var(--ac);color:var(--ai);border:1px solid var(--ac);border-radius:3px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:.88rem}
label.pick.alt{background:transparent;color:var(--ink);border-color:var(--go)}
label.pick input{position:absolute;opacity:0;width:1px;height:1px}
.drop{border:1px dashed var(--go);border-radius:3px;padding:26px 18px;text-align:center;color:var(--mu);line-height:1.7}
.drop b{display:block;font-family:var(--serif);font-size:2.2rem;color:var(--go);font-weight:500}
ul{list-style:none;margin:0;padding:0;max-height:min(38vh,320px);overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:1px solid var(--ln);border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--bg2)}
.row.cur{border-left-color:var(--ac);background:var(--bg2)}
.row .n{width:2.4em;text-align:center;font-family:var(--serif);color:var(--go)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{font-weight:500;color:var(--ac)}
.row .x{padding:2px 8px;border:none;background:transparent;color:var(--mu)}
.hint{color:var(--mu);font-size:.78rem;margin:12px 0 0}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="snow" id="petals" aria-hidden="true"></div>
<div class="shell">
  <header class="head">
    <div class="hanko" aria-hidden="true">狼</div>
    <div><div class="brand">音楽プレイヤー</div><div class="brand2">Lecteur de musique</div></div>
  </header>

  <section class="card player" id="player" aria-label="Lecteur">
    <div class="orb" id="scene">
      <div class="disc"><img class="cover" src="wolf-disc.webp" alt=""><video id="media" playsinline></video></div>
      <img class="frame" src="wolf-frame.webp" alt="">
    </div>
    <div class="meta">
      <h1 id="title">Aucun morceau</h1>
      <p class="sub" id="sub">Ajoute tes fichiers pour commencer</p>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button class="k" id="shuffle" aria-pressed="false" title="Lecture aléatoire" aria-label="Lecture aléatoire">乱</button>
      <button class="k" id="prev" title="Précédent" aria-label="Précédent">前</button>
      <button class="main" id="play" aria-label="Lecture">▶</button>
      <button class="k" id="next" title="Suivant" aria-label="Suivant">次</button>
      <button class="k" id="repeat" aria-pressed="false" title="Répéter la liste" aria-label="Répéter la liste">環</button>
    </div>
    <div class="vol"><span>音量</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
  </section>

  <section class="card list" id="list" aria-label="Playlist">
    <div class="top">
      <h2 id="count">Playlist</h2>
      <div class="btns">
        <label class="pick">Choisir un dossier<input type="file" id="folder" webkitdirectory multiple></label>
        <label class="pick alt">Ajouter des fichiers<input type="file" id="files" accept=".mp4,.m4a,.m4v,.mp3,.aac,.wav,.ogg,.flac,audio/*,video/mp4" multiple></label>
      </div>
    </div>
    <div class="drop" id="empty"><b>狼</b>Choisis le dossier qui contient tes musiques,<br>ou glisse ici tes fichiers .mp4.</div>
    <ul id="ul" hidden></ul>
    <p class="hint">Espace : lecture/pause. ← → : ±5 s. Maj + ← → : piste précédente/suivante.</p>
  </section>
</div>

<script>
(function(){
  var media=document.getElementById('media'),ul=document.getElementById('ul'),empty=document.getElementById('empty');
  var playBtn=document.getElementById('play'),seek=document.getElementById('seek'),vol=document.getElementById('vol');
  var titleEl=document.getElementById('title'),subEl=document.getElementById('sub'),curEl=document.getElementById('cur'),durEl=document.getElementById('dur');
  var countEl=document.getElementById('count'),scene=document.getElementById('scene'),player=document.getElementById('player'),cover=document.querySelector('.cover');
  var tracks=[],index=-1,shuffle=false,repeat=false,seeking=false;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var snow=document.getElementById('petals');
  for(var p=0;p<40;p++){
    var f=document.createElement('i'),w=2+Math.random()*4;
    f.style.left=(Math.random()*100)+'%';f.style.width=w+'px';f.style.height=w+'px';
    f.style.animationDuration=(8+Math.random()*8)+'s';f.style.animationDelay='-'+(Math.random()*14)+'s';
    snow.appendChild(f);
  }

  var K=['〇','一','二','三','四','五','六','七','八','九'];
  function kanji(n){if(n>99)return String(n);if(n<10)return K[n];if(n===10)return '十';if(n<20)return '十'+K[n-10];var t=Math.floor(n/10),o=n%10;return K[t]+'十'+(o?K[o]:'');}
  function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
  function clean(name){return name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim();}
  function paint(el,v){el.style.setProperty('--p',v+'%');}

  var actx=null,an=null,data=null,raf=0;
  function setupAudio(){
    if(actx||reduce)return;
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      var src=actx.createMediaElementSource(media);
      an=actx.createAnalyser();an.fftSize=64;src.connect(an);an.connect(actx.destination);
      data=new Uint8Array(an.frequencyBinCount);
    }catch(e){actx=null;an=null;}
  }
  function pulse(){
    if(an&&!media.paused){
      an.getByteFrequencyData(data);
      var b=(data[0]+data[1]+data[2]+data[3])/1020;
      cover.style.transform='scale('+(1+b*.08).toFixed(3)+')';
      raf=requestAnimationFrame(pulse);
    }
  }

  function addFiles(list){
    Array.prototype.forEach.call(list,function(f){
      if(!/\.(mp4|m4a|m4v|mp3|aac|wav|ogg|flac)$/i.test(f.name)&&!/^(audio|video)\//.test(f.type))return;
      tracks.push({name:clean(f.name),url:URL.createObjectURL(f)});
    });
    render();
    if(index<0&&tracks.length)load(0,false);
  }

  function render(){
    ul.innerHTML='';
    tracks.forEach(function(t,i){
      var li=document.createElement('li');li.className='row'+(i===index?' cur':'');li.tabIndex=0;
      var n=document.createElement('span');n.className='n';n.textContent=kanji(i+1);
      var tt=document.createElement('span');tt.className='t';tt.textContent=t.name;
      var x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Retirer '+t.name);
      x.onclick=function(e){e.stopPropagation();remove(i);};
      li.append(n,tt,x);
      li.onclick=function(){load(i,true);};
      li.onkeydown=function(e){if(e.key==='Enter'){load(i,true);}};
      ul.appendChild(li);
    });
    ul.hidden=!tracks.length;empty.hidden=!!tracks.length;
    countEl.textContent=tracks.length?('Playlist  '+kanji(tracks.length)+' 曲'):'Playlist';
  }

  function remove(i){
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i,1);
    if(i===index){
      media.pause();media.removeAttribute('src');media.load();index=-1;
      if(tracks.length){load(Math.min(i,tracks.length-1),false);}else{showInfo(null);}
    }else if(i<index){index--;}
    render();
  }

  function showInfo(t){
    titleEl.textContent=t?t.name:'Aucun morceau';
    subEl.textContent=t?('Piste '+(index+1)+' sur '+tracks.length):'Ajoute tes fichiers pour commencer';
    document.title=t?t.name+' – 音楽 Lecteur':'音楽 Lecteur';
  }

  function load(i,autoplay){
    if(i<0||i>=tracks.length)return;
    index=i;media.src=tracks[i].url;showInfo(tracks[i]);render();
    if('mediaSession' in navigator){
      try{navigator.mediaSession.metadata=new MediaMetadata({title:tracks[i].name,artist:'音楽 Lecteur'});}catch(e){}
    }
    if(autoplay){media.play().catch(function(){});}
  }

  function next(auto){
    if(!tracks.length)return;
    var i;
    if(shuffle&&tracks.length>1){do{i=Math.floor(Math.random()*tracks.length);}while(i===index);}
    else{i=index+1;if(i>=tracks.length){if(repeat||!auto){i=0;}else{media.pause();return;}}}
    load(i,true);
  }
  function prev(){
    if(!tracks.length)return;
    if(media.currentTime>3){media.currentTime=0;return;}
    load(index>0?index-1:tracks.length-1,true);
  }
  function toggle(){
    if(index<0)return;
    if(media.paused){media.play().catch(function(){});}else{media.pause();}
  }

  media.addEventListener('play',function(){
    playBtn.textContent='❚❚';playBtn.setAttribute('aria-label','Pause');document.body.classList.add('playing');
    setupAudio();if(actx&&actx.state==='suspended'){actx.resume();}
    cancelAnimationFrame(raf);pulse();
  });
  media.addEventListener('pause',function(){
    playBtn.textContent='▶';playBtn.setAttribute('aria-label','Lecture');document.body.classList.remove('playing');
    cover.style.transform='';
  });
  media.addEventListener('ended',function(){next(true);});
  media.addEventListener('loadedmetadata',function(){
    durEl.textContent=fmt(media.duration);
    scene.classList.toggle('has-video',media.videoWidth>0);
  });
  media.addEventListener('timeupdate',function(){
    curEl.textContent=fmt(media.currentTime);
    if(!seeking&&media.duration){seek.value=Math.round(media.currentTime/media.duration*1000);paint(seek,seek.value/10);}
  });
  media.addEventListener('error',function(){subEl.textContent='Ce fichier ne peut pas être lu par le navigateur.';});

  seek.addEventListener('input',function(){seeking=true;paint(seek,seek.value/10);if(media.duration){curEl.textContent=fmt(seek.value/1000*media.duration);}});
  seek.addEventListener('change',function(){if(media.duration){media.currentTime=seek.value/1000*media.duration;}seeking=false;});
  vol.addEventListener('input',function(){media.volume=vol.value/100;paint(vol,vol.value);});
  media.volume=0.8;paint(vol,80);

  playBtn.onclick=toggle;
  document.getElementById('next').onclick=function(){next(false);};
  document.getElementById('prev').onclick=prev;
  var shBtn=document.getElementById('shuffle'),rpBtn=document.getElementById('repeat');
  shBtn.onclick=function(){shuffle=!shuffle;shBtn.setAttribute('aria-pressed',shuffle);};
  rpBtn.onclick=function(){repeat=!repeat;rpBtn.setAttribute('aria-pressed',repeat);};

  document.getElementById('files').addEventListener('change',function(e){addFiles(e.target.files);e.target.value='';});
  document.getElementById('folder').addEventListener('change',function(e){
    var arr=Array.prototype.slice.call(e.target.files).sort(function(a,b){
      return (a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,'fr',{numeric:true});
    });
    addFiles(arr);e.target.value='';
  });

  var listEl=document.getElementById('list');
  ['dragenter','dragover'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();listEl.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();listEl.classList.remove('over');});});
  window.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files){addFiles(e.dataTransfer.files);}});

  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'&&e.target.type!=='file'&&e.target.type!=='range')return;
    if(e.code==='Space'&&tag!=='button'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'&&tag!=='input'){e.preventDefault();if(e.shiftKey){next(false);}else{media.currentTime=Math.min(media.duration||0,media.currentTime+5);}}
    else if(e.key==='ArrowLeft'&&tag!=='input'){e.preventDefault();if(e.shiftKey){prev();}else{media.currentTime=Math.max(0,media.currentTime-5);}}
  });

  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',toggle);
      navigator.mediaSession.setActionHandler('pause',toggle);
      navigator.mediaSession.setActionHandler('previoustrack',prev);
      navigator.mediaSession.setActionHandler('nexttrack',function(){next(false);});
    }catch(e){}
  }
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
  render();
})();
</script>
</body>
</html>
